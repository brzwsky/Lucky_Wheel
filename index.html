<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
			rel="stylesheet"
		/>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				background-image: url(img/bkg_full.png);
				background-size: cover;
				background-position: center;
				font-size: 14px;
			}

			header,
			footer {
				display: flex;
				justify-content: center;
				text-align: center;
				width: 100%;
				z-index: 2;
			}

			main {
				display: flex;
				align-items: stretch;
				justify-content: center;
			}

			img {
				display: block;
				max-width: 100%;
			}

			.page {
				display: flex;
				flex-direction: column;
				justify-content: center;
				min-height: 100vh;
			}

			/* Header */

			.logo {
				width: 11.3125em;
				margin: 1em auto 0em;
			}

			/* Main */

			.girl,
			.major {
				position: relative;
				width: 100%;
				height: auto;
				z-index: 3;
			}

			.girl {
				background-image: url(img/girl.png);
				background-repeat: no-repeat;
				background-position: right;
				margin-right: -17em;
			}

			.major {
				background-image: url(img/major.png);
				background-repeat: no-repeat;
				background-position: left;
				margin-left: -17em;
			}

			.stone {
				display: flex;
				justify-content: center;
				flex-direction: column;
				align-items: center;
				margin-top: -7em;
			}

			.wheel-container {
				background-image: url(img/stone_bkg.png);
				background-size: cover;
				position: relative;
				width: 80.5625em;
				height: 64.375em;
			}

			.arrow {
				position: absolute;
				background-image: url(img/arrow.png);
				background-size: contain;
				background-repeat: no-repeat;
				width: 9em;
				height: 12em;
				top: 6.7em;
				left: 51.5%;
				transform: translate(-50%, 0);
				z-index: 5;
			}

			.wheel {
				position: absolute;
				background-image: url(img/wheel.png);
				background-size: cover;
				background-repeat: no-repeat;
				background-position: center;
				width: 43em;
				height: 43em;
				top: 12.5em;
				left: 49.5%;
				border-radius: 30em;
				margin-left: -20em;
				overflow: hidden;
				transition: transform 1s ease-in-out;
			}

			/* Wheel Lights */

			.wheel-lights_container {
				position: relative;
				width: 100%;
				height: 100%;
				border-radius: 50%;
			}

			.lights {
				position: absolute;
				background-color: gold;
				border-radius: 50%;
				position: absolute;
				transform: translate(-50%, -50%);
				box-shadow: 0 0 5px 2px rgba(255, 215, 0, 0.8);
				animation: golden-blink 5s infinite;
			}

			@keyframes golden-blink {
				0% {
					box-shadow: 0 0 5px 5px rgba(255, 215, 0, 0.8);
					opacity: 1;
				}
				50% {
					box-shadow: 0 0 30px 40px rgba(255, 215, 0, 1);
					opacity: 0.2;
				}
				100% {
					box-shadow: 0 0 10px 10px rgba(255, 215, 0, 0.8);
					opacity: 1;
				}
			}

			.lgt-1 {
				top: 44%;
				left: 17.5%;
				animation-delay: 0s;
			}

			.lgt-2 {
				top: 38.5%;
				left: 40.5%;
				animation-delay: 2s;
			}

			.lgt-3 {
				top: 62.5%;
				left: 52%;
				animation-delay: 6s;
			}

			.lgt-4 {
				top: 77%;
				left: 36%;
				animation-delay: 4s;
			}

			.lgt-5 {
				top: 39%;
				left: 75.5%;
				animation-delay: 3s;
			}

			.lgt-6 {
				top: 57.5%;
				left: 80.5%;
				animation-delay: 5s;
			}

			/* Wheel Spin Btn */

			button {
				position: relative;
				border: none;
				background: url(img/button/button_pattern_right.svg) no-repeat left
						center,
					url(img/button/button_pattern_left.svg) no-repeat right center,
					#ffad00;
				padding: 1em 4em;
				border: none;
				border-radius: 0;
				cursor: pointer;
				margin: -4em 0 3em;
				position: relative;
				font-weight: 700;
				font-size: 1.75em;
				text-decoration: none;
				font-family: Arial, Helvetica, sans-serif;
				transition: background-color 0.3s;
				animation: btn-anim 2.5s ease-in-out infinite;
				box-shadow: 0 0 15px rgba(255, 173, 0, 0.8);
				z-index: 5;
			}

			button:hover {
				transform: scale(1.05);
				box-shadow: 0 0 20px rgba(255, 173, 0, 1);
				background-color: #ff9000;
			}

			button:active {
				background-color: #e68a00;
				transform: scale(0.98);
			}
			/* Footer */

			.payments_logo {
				display: flex;
				justify-content: center;
				flex-wrap: wrap;
				gap: 10px;
				padding: 10px 0;
			}

			.payments_logo a {
				display: inline-block;
			}

			.payments_logo img {
				display: block;
				width: 7.4375em;
			}

			/* PopUp */

			#popup {
				display: flex;
				justify-content: center;
				align-items: center;
				position: fixed;
				background: rgba(0, 0, 0, 0.3);
				backdrop-filter: blur(5px);
				width: 100%;
				height: 100%;
				left: 0;
				top: 0;
				opacity: 0;
				visibility: hidden;
				transform: scale(0.5);
				transition: transform 0.5s ease-out, opacity 0.5s ease-out;
				z-index: 15;
			}

			#popup.active {
				opacity: 1;
				visibility: visible;
				transform: scale(1);
			}

			#popup .popup-msg {
				position: relative;
				background-image: url(img/popup.png);
				background-size: contain;
				background-position: center center;
				background-repeat: no-repeat;
				text-align: center;
				font-family: Anton;
				color: #ffe500;
				padding: 18em;
				opacity: 0;
				transform: translate(0, -50%);
				transition: all 1.5s;
			}

			#popup h2 {
				font-size: 6em;
			}

			#popup span {
				font-size: 3em;
				color: #fff;
			}

			#popup p {
				font-size: 3em;
			}

			#popup button {
				margin: 0.5em auto;
			}

			#popup.active .popup-msg {
				opacity: 1;
				transform: translate(0, 0);
				display: flex;
				flex-direction: column;
			}

			/* Media */

			@media (max-width: 1500px) {
				body {
					font-size: 12px;
				}

				main {
					margin-bottom: -2.5%;
				}

				footer {
					background: linear-gradient(0, #000117, transparent);
					z-index: 99;
				}
			}

			@media (max-width: 1300px) {
				body {
					font-size: 11px;
				}
			}

			@media (max-width: 1250px) {
				.page {
					overflow: hidden;
				}
			}

			@media (max-width: 888px) {
				.page {
					overflow: hidden;
				}

				.major,
				.girl {
					display: none !important;
				}
			}

			@media (max-width: 720px) {
				footer {
					position: relative;
					z-index: 15;
				}

				body {
					background-image: url(img/mobile/bkg_tab.png);
					background-repeat: no-repeat;
					background-position: center;
					font-size: 15px;
				}

				.wheel-container {
					background-image: url(img/mobile/stone_tab.png);
					width: 48em;
					height: 66.06em;
				}

				.arrow {
					background-image: url(img/mobile/arrow_tab.png);
					top: 13.5%;
				}

				.wheel {
					background-image: url(img/mobile/wheel_tab.png);
					background-size: cover;
					top: 24%;
					left: 47.5%;
					font-size: 13px;
				}

				.lgt-1 {
					top: 43%;
					left: 15.5%;
				}

				.lgt-2 {
					top: 37.5%;
					left: 38.5%;
				}

				.lgt-3 {
					top: 63%;
					left: 51.5%;
				}

				.lgt-4 {
					top: 78%;
					left: 34%;
				}

				.lgt-5 {
					top: 39.5%;
					left: 75.6%;
				}

				.lgt-6 {
					top: 57%;
					left: 80.5%;
				}

				.payments_logo {
					background-color: black;
				}

				.payments_logo img {
					width: 8.125em;
				}

				#popup {
					z-index: 14;
				}

				#popup .popup-msg {
					padding: 9em;
					background-image: url(img/mobile/popup_tab.png);
				}

				#popup h2 {
					font-size: 4.875em;
				}

				#popup span {
					font-size: 2.875em;
				}

				#span p {
					font-size: 2.375em;
				}
			}

			@media (max-width: 560px) {
				body {
					font-size: 12px;
				}

				.wheel {
					top: 22.2%;
					left: 47%;
					font-size: 11px;
				}

				button {
					font-size: 1em;
				}

				#popup .popup-msg {
					padding: 10em;
					margin: 0 auto;
					background-image: url(img/mobile/popup_mob.png);
				}

				#popup h2 {
					font-size: 2.5em;
				}

				#popup span {
					font-size: 1.625em;
				}

				#popup p {
					font-size: 1.4375em;
				}
			}

			@media (max-width: 511px) {
				body {
					background-image: url(img/mobile/bkg_mob.png);
					background-size: cover;
				}

				.wheel-container {
					background-image: url(img/mobile/stone_mob.png);
					width: 30.4375em;
					height: 45.875em;
					font-size: 15px;
				}

				.arrow {
					background-image: url(img/mobile/arrow_mob.png);
					width: 6.1375em;
					top: 19%;
				}

				.wheel {
					background-image: url(img/mobile/wheel_mob.png);
					width: 21.375em;
					height: 21.625em;
					top: 27.4%;
					left: 5.7%;
					margin: 0;
					font-size: 19px;
				}

				.lgt-1 {
					top: 43%;
					left: 13%;
				}

				.lgt-2 {
					top: 37.5%;
					left: 37.5%;
				}

				.lgt-3 {
					top: 64%;
					left: 51%;
				}

				.lgt-4 {
					top: 79.5%;
					left: 33%;
				}

				.lgt-5 {
					top: 40%;
					left: 77%;
				}

				.lgt-6 {
					top: 58%;
					left: 81.8%;
				}

				.payments_logo a {
					width: 4.0625em;
				}
			}
			@media (max-width: 510px) {
				.wheel-container {
					font-size: 14.7px;
				}

				.wheel {
					font-size: 19px;
					top: 26.3%;
					left: 6%;
				}
			}

			@media (max-width: 400px) {
				.wheel-container {
					font-size: 13px;
				}

				.wheel {
					font-size: 16px;
					left: 8%;
				}

				#popup .popup-msg {
					padding: 7em;
				}
			}

			@media (max-width: 319px) {
				.wheel-container {
					font-size: 10.4px;
				}

				.wheel {
					font-size: 13.6px;
					top: 26%;
					left: 5%;
				}
			}
		</style>
		<title>Lucky Wheel</title>
	</head>
	<body>
		<div class="page">
			<header>
				<a class="logo">
					<img src="img/logo.svg" alt="logo.svg" />
				</a>
			</header>
			<main>
				<div class="girl"></div>
				<div class="stone">
					<div class="wheel-container">
						<div class="arrow"></div>
						<div class="wheel" id="wheel">
							<div class="wheel-lights_container">
								<div class="lights lgt-1"></div>
								<div class="lights lgt-2"></div>
								<div class="lights lgt-3"></div>
								<div class="lights lgt-4"></div>
								<div class="lights lgt-5"></div>
								<div class="lights lgt-6"></div>
							</div>
						</div>
					</div>
					<button id="wheelspin_btn">Spin The Wheel</button>
				</div>
				<div class="major"></div>
			</main>
			<footer>
				<div class="payments_logo">
					<a href="">
						<img src="img/mobile/partners_logo_mob/ApplePay.svg" alt="" />
					</a>
					<a href="">
						<img src="img/mobile/partners_logo_mob/GooglePay.svg" alt="" />
					</a>
					<a href="">
						<img src="img/mobile/partners_logo_mob/eZeeWallet.svg" alt="" />
					</a>
					<a href="">
						<img src="img/mobile/partners_logo_mob/Visa.svg" alt="" />
					</a>
					<a href="">
						<img src="img/mobile/partners_logo_mob/Mastercard.svg" alt="" />
					</a>
					<a href="">
						<img src="img/mobile/partners_logo_mob/Mifinity.svg" alt="" />
					</a>
					<a href="">
						<img src="img/mobile/partners_logo_mob/Skrill.svg" alt="" />
					</a>
					<a href="">
						<img src="img/mobile/partners_logo_mob/Neteller.svg" alt="" />
					</a>
					<a href="">
						<img src="img/mobile/partners_logo_mob/Paysafecard.svg" alt="" />
					</a>
					<a href="">
						<img src="img/mobile/partners_logo_mob/ImpayaN26.svg" alt="" />
					</a>
					<a href="">
						<img src="img/mobile/partners_logo_mob/Flexepin.svg" alt="" />
					</a>
					<a href="">
						<img src="img/mobile/partners_logo_mob/Binance.svg" alt="" />
					</a>
					<a href="">
						<img src="img/mobile/partners_logo_mob/Crypto.svg" alt="" />
					</a>
					<a href="">
						<img src="img/mobile/partners_logo_mob/Blik.svg" alt="" />
					</a>
				</div>
			</footer>
		</div>
		<div id="popup">
			<div class="popup-msg">
				<h2>Congratulations!</h2>
				<span>You won</span>
				<p id="bonus-msg"></p>
				<button id="takeBonus">Take bonus</button>
			</div>
		</div>
		<script src="script.js"></script>
	</body>
</html>
